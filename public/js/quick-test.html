<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test API Client</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 2rem;
      background: #f5f5f5;
    }
    .test-section {
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    button {
      background: #4f46e5;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      margin: 0.5rem 0.5rem 0.5rem 0;
      transition: background 0.2s;
    }
    button:hover {
      background: #4338ca;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    input {
      padding: 0.5rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin: 0.5rem 0;
      width: 200px;
    }
    pre {
      background: #f0f0f0;
      padding: 1rem;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 0.9rem;
    }
    .success { color: #22c55e; }
    .error { color: #ef4444; }
    .info { color: #3b82f6; }
    .output {
      max-height: 300px;
      overflow-y: auto;
      background: #fafafa;
      padding: 1rem;
      border-radius: 4px;
      margin-top: 1rem;
      font-family: monospace;
      font-size: 0.9rem;
      border: 1px solid #eee;
    }
  </style>
</head>
<body>
  <h1>🧪 Test API Client</h1>
  <p>Page de test pour vérifier que les APIs fonctionnent correctement.</p>

  <!-- Test 1 : fetchQuote -->
  <div class="test-section">
    <h2>1️⃣ Récupérer un cours (fetchQuote)</h2>
    <input type="text" id="tickerInput" placeholder="Ex: AAPL, BTC, MSFT" value="AAPL">
    <button onclick="testFetchQuote()">Récupérer le cours</button>
    <div id="output1" class="output" style="display:none"></div>
  </div>

  <!-- Test 2 : fetchQuotesBatch -->
  <div class="test-section">
    <h2>2️⃣ Récupérer plusieurs cours (batch)</h2>
    <button onclick="testFetchBatch()">Récupérer AAPL, BTC, MSFT</button>
    <div id="output2" class="output" style="display:none"></div>
  </div>

  <!-- Test 3 : fetchLivretRates -->
  <div class="test-section">
    <h2>3️⃣ Récupérer les taux des livrets</h2>
    <button onclick="testLivretRates()">Récupérer les taux</button>
    <div id="output3" class="output" style="display:none"></div>
  </div>

  <!-- Test 4 : Notification -->
  <div class="test-section">
    <h2>4️⃣ Tester les notifications</h2>
    <button onclick="apiClient.showNotification('✅ Succès!', 'success')">Success</button>
    <button onclick="apiClient.showNotification('❌ Erreur!', 'error')">Error</button>
    <button onclick="apiClient.showNotification('ℹ️ Info', 'info')">Info</button>
  </div>

  <!-- Test 5 : Format functions -->
  <div class="test-section">
    <h2>5️⃣ Tester les formatages</h2>
    <div id="output5" class="output"></div>
    <button onclick="testFormatting()">Tester les formats</button>
  </div>

  <script src="api-client.js"></script>
  <script>
    function log(id, message, type = 'info') {
      const output = document.getElementById(id);
      output.style.display = 'block';

      const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
      const line = `<div class="${className}">${escapeHtml(message)}</div>`;
      output.innerHTML += line + '\n';
      output.scrollTop = output.scrollHeight;
    }

    function clearLog(id) {
      document.getElementById(id).innerHTML = '';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function testFetchQuote() {
      const ticker = document.getElementById('tickerInput').value.trim();
      if (!ticker) {
        alert('Entrez un ticker');
        return;
      }

      clearLog('output1');
      log('output1', `Récupération de ${ticker}...`, 'info');

      try {
        const quote = await apiClient.fetchQuote(ticker);
        log('output1', JSON.stringify(quote, null, 2), 'success');
        log('output1', `Formaté: ${apiClient.formatPrice(quote.price, quote.currency)}`, 'success');
      } catch (error) {
        log('output1', error.message, 'error');
      }
    }

    async function testFetchBatch() {
      clearLog('output2');
      log('output2', 'Récupération AAPL, BTC, MSFT...', 'info');

      try {
        const result = await apiClient.fetchQuotesBatch(['AAPL', 'BTC', 'MSFT']);
        result.quotes.forEach(q => {
          if (q.ok) {
            log('output2', `${q.ticker}: ${apiClient.formatPrice(q.data.price, q.data.currency)}`, 'success');
          } else {
            log('output2', `${q.ticker}: ${q.error}`, 'error');
          }
        });
      } catch (error) {
        log('output2', error.message, 'error');
      }
    }

    async function testLivretRates() {
      clearLog('output3');
      log('output3', 'Récupération des taux...', 'info');

      try {
        const rates = await apiClient.fetchLivretRates();
        log('output3', JSON.stringify(rates, null, 2), 'success');
      } catch (error) {
        log('output3', error.message, 'error');
      }
    }

    function testFormatting() {
      clearLog('output5');

      const tests = [
        { fn: 'formatPrice', args: [185.25, 'EUR'], expected: '185,25 EUR' },
        { fn: 'formatPrice', args: [67234.50, 'EUR'], expected: '67 234,50 EUR' },
        { fn: 'formatTimeAgo', args: [new Date().toISOString()], expected: 'à l\'instant' },
        { fn: 'formatTimeAgo', args: [new Date(Date.now() - 5*60000).toISOString()], expected: 'il y a 5m' },
      ];

      tests.forEach(test => {
        const fn = apiClient[test.fn];
        const result = fn(...test.args);
        log('output5', `${test.fn}(${test.args.join(', ')}) = ${result}`, 'success');
      });
    }

    // Tester les formatages au chargement
    window.addEventListener('DOMContentLoaded', () => {
      log('output5', '✅ API Client chargé et prêt à tester', 'success');
      log('output5', `Fonctions disponibles: ${Object.keys(apiClient).join(', ')}`, 'info');
    });
  </script>
</body>
</html>
